name: Deploy Backend to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Hugging Face Spaces
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Verify backend imports
        working-directory: ./backend
        run: |
          pip install fastapi uvicorn sqlalchemy pydantic python-dotenv
          python -c "from app.main import app; print('Backend OK')" || true

      - name: Deploy to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
        run: |
          pip install huggingface_hub
          python << 'EOF'
          import os
          import shutil
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN")
          space_id = os.environ.get("HF_SPACE_ID")

          if not token or not space_id:
              print("HF_TOKEN or HF_SPACE_ID not set, skipping deployment")
              exit(0)

          # Create temp directory for deployment
          deploy_dir = "hf_deploy"
          os.makedirs(deploy_dir, exist_ok=True)
          
          # Copy all backend files
          for item in os.listdir("backend"):
              src = os.path.join("backend", item)
              dst = os.path.join(deploy_dir, item)
              if os.path.isdir(src) and item not in ["__pycache__", "venv", "tests"]:
                  shutil.copytree(src, dst, dirs_exist_ok=True)
              elif os.path.isfile(src) and not item.endswith((".pyc", ".log")):
                  shutil.copy2(src, dst)
          
          # Copy app.py to root (for Hugging Face Spaces)
          if os.path.exists("backend/app.py"):
              shutil.copy2("backend/app.py", os.path.join(deploy_dir, "app.py"))

          api = HfApi(token=token)
          api.upload_folder(
              folder_path=deploy_dir,
              repo_id=space_id,
              repo_type="space",
              ignore_patterns=[
                  "__pycache__", "*.pyc", ".env",
                  "venv", "tests", "*.log"
              ]
          )
          
          # Cleanup
          import shutil
          shutil.rmtree(deploy_dir)
          
          print(f"Deployed to https://huggingface.co/spaces/{space_id}")
          EOF
